name: Build & Release (Windows)

# Manual run from the Actions tab, or push a tag like v1.2.4
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # lets GITHUB_TOKEN create/upload the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
